services:
  postgres:
    image: postgres:17
    container_name: order-management-db
    environment:
      POSTGRES_DB: order_management
      POSTGRES_USER: order_app
      POSTGRES_PASSWORD: justatest
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U order_app -d order_management"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data: